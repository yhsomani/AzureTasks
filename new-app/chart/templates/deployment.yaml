apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workops.fullname" . | default "workops-app" }}
  labels:
    app.kubernetes.io/name: workops
    app.kubernetes.io/instance: {{ .Release.Name | default "workops" }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | default "Helm" }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: workops
      app.kubernetes.io/instance: {{ .Release.Name | default "workops" }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/name: workops
        app.kubernetes.io/instance: {{ .Release.Name | default "workops" }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default "workops-sa" }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: workops
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default 3000 }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "workops.fullname" . | default "workops-app" }}-config
            - secretRef:
                name: {{ include "workops.fullname" . | default "workops-app" }}-secret
                optional: true
