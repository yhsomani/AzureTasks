apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workops.fullname" . | default "workops-app" }}-secret
  labels:
    app.kubernetes.io/name: workops
    app.kubernetes.io/instance: {{ .Release.Name | default "workops" }}
type: Opaque
stringData:
  AZURE_DEVOPS_PAT: {{ .Values.secretEnv.AZURE_DEVOPS_PAT | quote }}
  GITHUB_TOKEN: {{ .Values.secretEnv.GITHUB_TOKEN | quote }}
  PLAN_SIGNING_SECRET: {{ .Values.secretEnv.PLAN_SIGNING_SECRET | quote }}
  SESSION_SECRET: {{ .Values.secretEnv.SESSION_SECRET | quote }}
  API_AUTH_TOKEN: {{ .Values.secretEnv.API_AUTH_TOKEN | quote }}
