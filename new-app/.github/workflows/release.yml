name: WorkOps Production Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Verification
        run: |
          npm run typecheck
          npm test
          npm run test:e2e

      - name: Build Application Bundle
        run: npm run build

      - name: Extract Release Tag
        id: vars
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package Dist Artifacts
        run: |
          tar -czvf workops-${{ steps.vars.outputs.TAG_NAME }}.tar.gz dist/ package.json package-lock.json chart/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: workops-${{ steps.vars.outputs.TAG_NAME }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Tag Release Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.TAG_NAME }}
            ghcr.io/${{ github.repository }}:latest
