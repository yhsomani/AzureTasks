name: Issue11 ESLint 10 Migration

on:
  push:
    branches:
      - fix/issue11-ci-security-hardening-20261018

permissions:
  contents: write

concurrency:
  group: issue11-eslint10-migration
  cancel-in-progress: false

jobs:
  migrate-eslint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-app/package-lock.json
      - name: Upgrade unsupported lint toolchain and regenerate lockfile
        run: |
          npm install --save-dev --save-exact eslint@10.12.0
          npm ci
      - name: Revalidate complete dependency tree and application
        run: |
          npm audit --package-lock-only --audit-level=high
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm test
          npm run build
      - name: Commit reviewed toolchain changes only to fix branch
        env:
          TARGET_BRANCH: fix/issue11-ci-security-hardening-20261018
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(deps): migrate unsupported ESLint 9 to 10 with verified lockfile"
          git push origin HEAD:"$TARGET_BRANCH"
