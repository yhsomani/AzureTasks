name: Issue 11 Test Toolchain Migration

on:
  push:
    branches:
      - fix/issue11-ci-security-hardening-20261018

permissions:
  contents: write

concurrency:
  group: issue11-test-toolchain-migration
  cancel-in-progress: false

jobs:
  migrate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-app/package-lock.json
      - name: Resolve patched Vitest runner and lockfile
        run: npm install --save-dev --save-exact vitest@5.0.5 @vitest/coverage-v8@5.0.5
      - name: Verify entire dependency tree
        run: |
          npm audit --audit-level=high
          npm ci
      - name: Verify application
        run: |
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm test
          npm run build
      - name: Commit verified package and lock updates only to repair branch
        env:
          TARGET_BRANCH: fix/issue11-ci-security-hardening-20261018
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already resolved"
            exit 0
          fi
          git commit -m "fix(deps): upgrade Vitest and coverage to patched v5 with regenerated lockfile"
          git push origin HEAD:"$TARGET_BRANCH"
