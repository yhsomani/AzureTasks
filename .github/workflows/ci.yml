name: CI

on:
  push:
    branches: [ main, master, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-app:
    name: Validate 3in1 Task Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Report complete dependency audit (including development tooling)
        run: |
          npm audit --json > /tmp/azuretasks-audit.json || true
          node -e "const a=require('/tmp/azuretasks-audit.json'); console.log('Dependency advisories: '+JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(name+': '+v.severity+'; fix='+JSON.stringify(v.fixAvailable));"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Test
        run: npm run test:coverage
      - name: Validate browser and staging verification scripts
        run: |
          node --check src/presentation/web/public/app.js
          node --check scripts/staging-readonly-verify.mjs
      - name: Read-only Azure schema preflight tests
        run: |
          node --check scripts/verify-azure-schema.mjs
          npm run test:schema
      - name: Build
        run: npm run build
      - name: Smoke test HTTP shell and access protection
        shell: bash
        run: |
          set -euo pipefail
          API_AUTH_TOKEN=ci-smoke NODE_ENV=production PORT=3188 node dist/index.js serve > /tmp/azuretasks-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3188/api/health > /tmp/azuretasks-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/azuretasks-server.log; exit 1; fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3188/)
          test "$status" = 401
          curl --silent --show-error --fail --user admin:ci-smoke http://127.0.0.1:3188/ > /tmp/azuretasks-index.html
          curl --silent --show-error --fail --user admin:ci-smoke http://127.0.0.1:3188/app.js > /tmp/azuretasks-app.js
          curl --silent --show-error --fail --user admin:ci-smoke http://127.0.0.1:3188/styles.css > /tmp/azuretasks-styles.css
          grep -q 'nav-group-label' /tmp/azuretasks-index.html
          grep -q 'function plannerSelectionSignature' /tmp/azuretasks-app.js
          grep -q '.nav-backdrop.open' /tmp/azuretasks-styles.css

      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser user journey tests
        run: node tests/browser/ui-journeys.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-browser-screenshots
          path: new-app/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  cross-platform:
    name: Cross-platform core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: new-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-app/package-lock.json
      - name: Install clean dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate browser script syntax
        run: node --check src/presentation/web/public/app.js
