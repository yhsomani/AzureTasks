name: CI

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-app:
    name: Validate 3in1 Task Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:coverage
      - name: Validate browser script syntax
        run: node --check src/presentation/web/public/app.js
      - name: Build
        run: npm run build
      - name: Smoke test HTTP shell and access protection
        shell: bash
        run: |
          set -euo pipefail
          API_AUTH_TOKEN=ci-smoke NODE_ENV=production PORT=3188 node dist/index.js serve > /tmp/azuretasks-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3188/api/health > /tmp/azuretasks-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/azuretasks-server.log; exit 1; fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3188/)
          test "$status" = 401
          curl --silent --show-error --fail --user admin:ci-smoke http://127.0.0.1:3188/ > /tmp/azuretasks-index.html
          curl --silent --show-error --fail --user admin:ci-smoke http://127.0.0.1:3188/app.js > /tmp/azuretasks-app.js
          curl --silent --show-error --fail --user admin:ci-smoke http://127.0.0.1:3188/styles.css > /tmp/azuretasks-styles.css
          grep -q 'nav-group-label' /tmp/azuretasks-index.html
          grep -q 'function plannerSelectionSignature' /tmp/azuretasks-app.js
          grep -q '.nav-backdrop.open' /tmp/azuretasks-styles.css
